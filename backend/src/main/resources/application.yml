server:
  port: 8080

spring:
  application:
    name: flowforge-backend

  # Default profile: in-memory H2, zero setup, data is lost on restart.
  # Switch to the "postgres" profile (see application-postgres.yml) for real persistence.
  datasource:
    url: jdbc:h2:mem:flowforge;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

flowforge:
  jwt:
    # Change this secret before deploying anywhere real.
    secret: "change-this-flowforge-dev-secret-key-please-replace-before-prod-0123456789"
    expiration-ms: 86400000 # 24h
  ai:
    provider: ${FLOWFORGE_AI_PROVIDER:local}
    model: ${FLOWFORGE_AI_MODEL:gpt-4.1-mini}
    openai-api-key: ${OPENAI_API_KEY:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
  security:
    allowed-origins: ${FLOWFORGE_ALLOWED_ORIGINS:*}
    rate-limit-per-minute: ${FLOWFORGE_RATE_LIMIT_PER_MINUTE:120}
  app:
    frontend-url: ${FLOWFORGE_FRONTEND_URL:http://localhost:5173}

logging:
  level:
    com.flowforge: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
