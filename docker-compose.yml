services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: flowforge
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
    ports:
      - "5432:5432"
    volumes:
      - flowforge-db:/var/lib/postgresql/data

  backend:
    build: ./backend/flowforge
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flowforge
      DB_USER: flowforge
      DB_PASSWORD: flowforge
      FLOWFORGE_JWT_SECRET: change-this-secret-before-production
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend/flowforge-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  flowforge-db:
