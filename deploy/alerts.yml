groups:
  - name: flowforge
    rules:
      - alert: FlowForgeBackendDown
        expr: up{job="flowforge-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: FlowForge backend is down
      - alert: FlowForgeHighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Backend 5xx rate is elevated
