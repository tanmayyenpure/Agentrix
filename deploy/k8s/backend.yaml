apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowforge-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flowforge-backend
  template:
    metadata:
      labels:
        app: flowforge-backend
    spec:
      containers:
        - name: backend
          image: flowforge-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: flowforge-backend
spec:
  selector:
    app: flowforge-backend
  ports:
    - port: 8080
      targetPort: 8080
